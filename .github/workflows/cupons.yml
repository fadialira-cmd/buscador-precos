name: Monitor de cupons

env:
  TZ: America/Sao_Paulo

on:
  schedule:
    - cron: "*/5 * * * *"  # a cada 5 min (menor intervalo do GitHub)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gravar-repo
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Checar cupons
        working-directory: cupons
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python monitor_cupons.py --uma-vez
      - name: Salvar status
        run: |
          git config user.name "cupons-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cupons/cupons.json cupons/historico_cupons.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Cupons $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase && git push
